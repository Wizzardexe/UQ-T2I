repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.3
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]
        name: isort (python)