[project]
name = "uq-t2i"
version = "0.1.0"
description = "Uncertainty Quantification in Text-to-Image Models"
readme = "README.md"
authors = [
    { name = "Adrian Weghorst", email = "adrian.weghorst@campus.lmu.de" }
]
requires-python = ">=3.12"
dependencies = [
    "diffusers[torch]>=0.42.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
    "tyro>=1.0.16",
    "wandb>=0.31.0",
]

[project.scripts]
uq-t2i = "uq_t2i:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
